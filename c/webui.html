<title>QwenEngine · Qwen3.5-27B</title>
<!--
  The harness UI.

  THE AGENT LOOP LIVES HERE, THE TOOLS DO NOT. The page decides when to call a tool and
  what to show; the server decides whether a call may happen at all and runs it. Nothing in
  this file can reach the filesystem — it can only POST {name, arguments} to /v1/tools/exec,
  and only names the server itself published at /v1/tools. So a bug in this page cannot widen
  what the agent is allowed to do, and the schemas the model is shown are generated from the
  same registry that executes them.

  WHY THE MESSAGE LIST IS APPEND-ONLY. Every turn resends the whole conversation, and the
  engine prefills only the part that is NEW — it keeps the token sequence already in the KV
  cache and extends it. Editing or dropping an earlier message changes the prefix and throws
  the whole cache away, which on this machine costs about a second per thousand tokens. So
  this page never rewrites history: it appends the assistant turn, appends the tool results,
  and appends the next turn. That is also why the tool definitions and the system prompt go
  first — they are the most stable bytes in the prompt.
-->
<style>
:root{
  --bg:#ffffff; --bg-alt:#f7f7f8; --bg-soft:#fafafa;
  --fg:#1f1f22; --fg-dim:#6b6b76; --fg-faint:#9a9aa5;
  --line:#e6e6ea; --accent:#c96442; --accent-soft:#f6ede9;
  --code-bg:#f4f4f6; --user-bg:#f0f0f2;
  --ok:#2f7d55; --ok-soft:#eaf5ee; --bad:#b4372a; --bad-soft:#fbecea;
  --radius:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1b1d; --bg-alt:#232326; --bg-soft:#1f1f22;
    --fg:#e9e9ec; --fg-dim:#a0a0ab; --fg-faint:#70707c;
    --line:#313136; --accent:#d97757; --accent-soft:#2c231f;
    --code-bg:#232326; --user-bg:#2a2a2e;
    --ok:#5fb383; --ok-soft:#1c2a22; --bad:#e0705f; --bad-soft:#2c1e1c;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1b1d; --bg-alt:#232326; --bg-soft:#1f1f22;
  --fg:#e9e9ec; --fg-dim:#a0a0ab; --fg-faint:#70707c;
  --line:#313136; --accent:#d97757; --accent-soft:#2c231f;
  --code-bg:#232326; --user-bg:#2a2a2e;
  --ok:#5fb383; --ok-soft:#1c2a22; --bad:#e0705f; --bad-soft:#2c1e1c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--bg);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  box-shadow:0 0 0 3px var(--accent-soft)}
.brand small{font-weight:400;color:var(--fg-dim);font-size:12.5px}
header .sp{flex:1}
button.ghost{background:none;border:1px solid var(--line);color:var(--fg-dim);border-radius:8px;
  padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;transition:.14s}
button.ghost:hover{background:var(--bg-alt);color:var(--fg)}
button.ghost.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#stat{display:flex;gap:7px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums;
  white-space:nowrap}
#stat .kv{display:flex;gap:5px;align-items:baseline;border:1px solid var(--line);border-radius:7px;
  padding:2px 8px;background:var(--bg-soft)}
#stat .kv u{text-decoration:none;color:var(--fg-faint);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.05em}
#stat .kv b{font-weight:600;font-size:12px}
#stat .kv.hit b{color:var(--ok)} #stat .kv.spd b{color:var(--accent)}
#stat .kv.cold b{color:var(--fg-dim)}

/* segmented Chat / Agent */
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;font:inherit;font-size:13px;padding:5px 13px;color:var(--fg-dim);

#proj:focus{outline:0;border-color:var(--accent)}

.shell{flex:1;display:flex;min-height:0}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}

<body>
<header>

<div class="shell">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), main = $('#main'), ta = $('#ta'), send = $('#send');

let messages = [];          /* append-only: see the note at the top of this file */
let tools = [], policy = {}, sysPrompt = '', workspace = '', toolMode = 'off';
let project = localStorage.getItem('project') || '', projectsRoot = '';
let busy = false, ctrl = null, stopped = false;
let sessionAllow = new Set();
let mode = localStorage.getItem('mode') || 'agent';

/* ---------- theme ---------- */
const saved = localStorage.getItem('theme');
if (saved) document.documentElement.dataset.theme = saved;
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
};
$('#tjb').onclick = () => { $('#traj').classList.toggle('on'); $('#tjb').classList.toggle('on'); };

/* ---------- a small markdown renderer ----------
   Deliberately small: fenced code, inline code, headings, lists, quotes, tables, bold/italic,
   links. Everything is escaped first, so nothing the model writes can inject markup. */
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function inline(s){
  return esc(s)
    .replace(/`([^`\n]+)`/g, (_,c) => '<code>'+c+'</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src){
  const out = [];
  const lines = String(src).split('\n');
  let i = 0;
  while (i < lines.length){
    const L = lines[i];
    const fence = L.match(/^```(\w*)/);
    if (fence){
      const lang = fence[1]; const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><button class="copy">kopieren</button><code data-lang="'+esc(lang)+'">'
               + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const h = L.match(/^(#{1,3})\s+(.*)$/);
    if (h){ const n = h[1].length; out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>'); i++; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(L)){
      const ordered = /^\s*\d+\./.test(L);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i]))
        items.push(inline(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, '')));
      out.push('<'+(ordered?'ol':'ul')+'>'+items.map(t=>'<li>'+t+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');
      continue;
    }
    if (/^>\s?/.test(L)){
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');
      continue;
    }
    if (/^\|.*\|/.test(L) && i+1 < lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      const row = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = row(lines[i]); i += 2;
      const body = [];
      while (i < lines.length && /^\|.*\|/.test(lines[i])) body.push(row(lines[i++]));
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'
        + body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')
        + '</tbody></table>');
      continue;
    }
    if (/^\s*---+\s*$/.test(L)){ out.push('<hr>'); i++; continue; }
    if (!L.trim()){ i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^```|^#{1,3}\s|^\s*([-*+]|\d+\.)\s|^>|^\|/.test(lines[i]))
      buf.push(lines[i++]);
    out.push('<p>'+inline(buf.join('\n')).replace(/\n/g,'<br>')+'</p>');
  }
  return out.join('');
}

document.addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if (!b) return;
  navigator.clipboard.writeText(b.parentElement.querySelector('code').textContent);
  b.textContent = 'kopiert'; setTimeout(()=>b.textContent='kopieren', 1200);
});

/* ---------- chat rendering ---------- */
let pinned = true;
main.addEventListener('scroll', () => {
  pinned = main.scrollHeight - main.scrollTop - main.clientHeight < 90;
});
function stick(){ if (pinned) main.scrollTop = main.scrollHeight; }

function emptyState(){
  const agent = mode === 'agent' && toolMode !== 'off';
  const chips = agent
    ? ['Was macht dieses Projekt? Verschaff dir einen Überblick.',
       'Baue das Projekt und zeig mir den ersten Fehler.',
       'Finde alle TODO-Kommentare und fasse sie zusammen.']
    : ['Erklär mir Gated DeltaNet in drei Sätzen.',
       'Schreib eine Python-Funktion für Binärsuche.',
       'Was begrenzt Inferenzgeschwindigkeit auf einem Laptop?'];
  chat.innerHTML = '<div class="empty" id="empty"><h1>'
    + (agent ? 'Woran arbeiten wir?' : 'Womit kann ich helfen?') + '</h1><p>'
    + (agent ? 'Agent mit Shell- und Dateizugriff in <code>' + esc(workspace) + '</code>'
             : 'Läuft lokal auf dieser Maschine — GPU und CPU teilen sich jede Schicht.')
    + '</p><div class="chips">'
    + chips.map(c => '<div class="chip">' + esc(c) + '</div>').join('') + '</div></div>';
}

function addUser(text){
  $('#empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = '<div class="body"></div>';
  d.querySelector('.body').textContent = text;
  chat.appendChild(d); stick();
}
function addBot(cont){
  $('#empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg bot' + (cont ? ' cont' : '');
  d.innerHTML = '<div class="role"><span class="dot"></span>Qwen3.5</div>'
              + '<details class="think" style="display:none"><summary>Denkt nach…</summary>'
              + '<div class="inner"></div></details>'
              + '<div class="body"></div><div class="tools"></div>';
  chat.appendChild(d); stick();
  return { el:d, think:d.querySelector('details'), inner:d.querySelector('.inner'),
           tools:d.querySelector('.tools'), body:d.querySelector('.body') };
}

/* ---------- how a tool call is described ----------
   One line that says what will happen, because that line is what the user approves. Showing
   the raw JSON instead makes a `rm -rf` in a "command" field look exactly like a path. */
function argLine(name, a){
  switch(name){
    case 'bash':       return a.command || '';
    case 'read_file':  return a.path + (a.offset ? '  ab Zeile ' + a.offset : '');
    case 'write_file': return a.path;
    case 'edit_file':  return a.path;
    case 'list_dir':   return a.path || '.';
    case 'glob':       return a.pattern + (a.path ? '  in ' + a.path : '');
    case 'grep':       return '/' + a.pattern + '/' + (a.glob ? '  ' + a.glob : '')
                             + (a.path ? '  in ' + a.path : '');
    default:           return JSON.stringify(a);
  }
}
const ICO = { bash:'>', read_file:'R', write_file:'W', edit_file:'E',
              list_dir:'L', glob:'*', grep:'/' };

/* What the user sees BEFORE approving: the command itself, the new file, or the exact two
   lines an edit swaps. */
function previewOf(name, a){
  if (name === 'bash')  return '<div class="tc-pre">' + esc(a.command || '') + '</div>';
  if (name === 'write_file'){
    const c = String(a.content || '').split('\n');
    return '<div class="tc-pre">' + esc(c.slice(0,40).join('\n'))
         + (c.length > 40 ? '\n… ' + (c.length-40) + ' weitere Zeilen …' : '') + '</div>';
  }
  if (name === 'edit_file'){
    const dl = String(a.old_string||'').split('\n').map(l => '<span class="del">- '+esc(l)+'</span>');
    const al = String(a.new_string||'').split('\n').map(l => '<span class="add">+ '+esc(l)+'</span>');
    return '<div class="tc-pre">' + dl.concat(al).join('\n') + '</div>';
  }
  return '';
}

function addCard(host, name, args){
  const d = document.createElement('div');
  d.className = 'tc'; d.dataset.s = 'run';
  d.innerHTML = '<div class="tc-h">'
      + '<span class="tc-ico">' + esc(ICO[name] || '?') + '</span>'
      + '<span class="tc-name">' + esc(name) + '</span>'
      + '<span class="tc-arg"></span><span class="tc-meta"><span class="spin">◌</span></span>'
      + '<span class="tc-caret">›</span></div>'
      + '<pre class="tc-out"><code></code></pre>';
  d.querySelector('.tc-arg').textContent = argLine(name, args);
  d.querySelector('.tc-h').onclick = () => d.classList.toggle('open');
  host.appendChild(d); stick();
  return d;
}
/* What this result will COST on the next turn. It is the dominant term in an agent loop on
   this machine — a 4 KiB tool result is ~1.1k tokens is ~1.8 min of prefill before the model
   says a word — and putting it on the card is the difference between "the thing is slow" and
   "that grep was too wide". Prefill rate comes from the last measured turn, not a constant. */
let preRate = 10.5;
function costOf(bytes){
  const tok = bytes/3.6, s = tok/Math.max(preRate,0.1);
  return '≈' + (tok >= 1000 ? (tok/1000).toFixed(1)+'k' : Math.round(tok)) + ' Tok'
       + ' · ' + (s >= 60 ? (s/60).toFixed(1)+' min' : Math.round(s)+' s') + ' Prefill';
}

function cardDone(d, state, meta, text, openIt){
  d.dataset.s = state;
  d.querySelector('.tc-ico').textContent = state === 'ok' ? '✓' : state === 'run' ? '◌' : '!';
  d.querySelector('.tc-meta').textContent = meta;
  if (text && text.length > 200){
    const c = document.createElement('span');
    c.className = 'tc-cost'; c.textContent = costOf(text.length);
    d.querySelector('.tc-meta').before(c);
  }
  d.querySelector('.tc-out code').textContent = text || '(leer)';
  d.querySelector('.tc-ask')?.remove();
  if (openIt) d.classList.add('open');
  stick();
}

/* The approval seam. The server has already REFUSED the call at this point — this asks for the
   one thing that would turn the refusal into a run, and nothing happens until it comes back. */
function askApproval(d, name, args, reason){
  return new Promise(resolve => {
    d.dataset.s = 'ask';
    d.querySelector('.tc-ico').textContent = '?';
    d.querySelector('.tc-meta').textContent = 'Freigabe';
    const box = document.createElement('div');
    box.className = 'tc-ask';
    box.innerHTML = previewOf(name, args)
      + '<div class="q">' + esc(reason || 'braucht eine Freigabe') + '</div>'
      + '<div class="btns"><button class="go">Ausführen</button>'
      + '<button class="all">' + esc(name) + ' immer in dieser Sitzung</button>'
      + '<button class="no">Ablehnen</button></div>';
    d.querySelector('.tc-out').before(box);
    stick();
    box.querySelector('.go').onclick  = () => { box.remove(); resolve('once'); };
    box.querySelector('.all').onclick = () => { sessionAllow.add(name); box.remove(); resolve('once'); };
    box.querySelector('.no').onclick  = () => { box.remove(); resolve('no'); };
  });
}

/* ---------- trajectory ---------- */
let tj = { steps: [], model_s:0, tool_s:0, ptok:0, ctok:0, cached:0 };
function tjPush(row){ tj.steps.push(row); tjRender(); }
function tjRender(){
  const T = tj;
  $('#tjtot').innerHTML =
      '<span>Schritte</span><b>' + T.steps.filter(s=>s.kind==='model').length + '</b>'
    + '<span>Modellzeit</span><b>' + T.model_s.toFixed(1) + ' s</b>'
    + '<span>Werkzeugzeit</span><b>' + T.tool_s.toFixed(1) + ' s</b>'
    + '<span>Prompt-Token</span><b>' + T.ptok + '</b>'
    + '<span>davon im Cache</span><b>' + (T.ptok ? (100*T.cached/T.ptok).toFixed(1) : '0') + ' %</b>'
    + '<span>generiert</span><b>' + T.ctok + '</b>';
  $('#tjsteps').innerHTML = T.steps.map((s,i) => {
    if (s.kind === 'tool')
      return '<div class="st tool"><div class="n">' + esc(s.name) + '</div><div class="r">'
           + '<span>Dauer</span><span>' + s.ms.toFixed(0) + ' ms</span>'
           + '<span>Ausgabe</span><span>' + s.bytes + ' B</span>'
           + (s.exit !== undefined ? '<span>exit</span><span>' + s.exit + '</span>' : '')
           + '</div></div>';
    const tot = Math.max(s.pre + s.dec, 0.001);
    return '<div class="st"><div class="n">Schritt ' + s.step + '</div><div class="r">'
      + '<span>Prompt</span><span>' + s.ptok + ' (' + s.cached + ' cached)</span>'
      + '<span>Prefill</span><span>' + s.pre.toFixed(2) + ' s'
        + (s.ptok > s.cached ? ' · ' + ((s.ptok-s.cached)/Math.max(s.pre,.001)).toFixed(1) + ' tok/s' : '') + '</span>'
      + '<span>1. Token</span><span>' + s.ttft.toFixed(2) + ' s</span>'
      + '<span>Decode</span><span>' + s.ctok + ' · ' + (s.ctok/Math.max(s.dec,.001)).toFixed(2) + ' tok/s</span>'
      + '</div><div class="bar"><i class="pf" style="width:' + (100*s.pre/tot) + '%"></i>'
      + '<i class="dc" style="width:' + (100*s.dec/tot) + '%"></i></div>'
      + '<div class="lg">prefill / decode</div></div>';
  }).join('');
}

/* The two numbers this engine lives and dies by, kept in the header where they are always
   visible. The cache hit rate is CUMULATIVE over the session, because that is the quantity
   that decides whether a long agent run is bearable: a single turn can be 100% or 0% by luck
   of where the prefix broke, and neither tells you anything. Decode tok/s is per turn — it is
   a property of the machine and does not average usefully. */
function statLine(u){
  const hit = tj.ptok ? 100*tj.cached/tj.ptok : 0;
  const dec = u ? u.completion_tokens/Math.max(u.decode_s||.001,.001) : 0;
  const pre = u && u.prefill_s > 0 && u.prompt_tokens > u.prompt_tokens_cached
            ? (u.prompt_tokens - u.prompt_tokens_cached)/u.prefill_s : 0;
  if (pre > 0.5) preRate = pre;
  $('#stat').innerHTML =
      '<span class="kv ' + (hit >= 50 ? 'hit' : 'cold') + '"><u>cache</u><b>'
        + hit.toFixed(1) + ' %</b></span>'
    + '<span class="kv spd"><u>decode</u><b>' + dec.toFixed(2) + ' tok/s</b></span>'
    + (pre ? '<span class="kv"><u>prefill</u><b>' + pre.toFixed(1) + ' tok/s</b></span>' : '')
    + '<span class="kv"><u>ctx</u><b>' + (tj.ptok ? u.total_tokens : 0) + '</b></span>';
  $('#hint').textContent = u
    ? u.prompt_tokens + ' Prompt-Token, ' + (u.prompt_tokens_cached||0) + ' aus dem Cache · '
      + 'Prefill ' + (u.prefill_s||0).toFixed(2) + ' s · '
      + u.completion_tokens + ' generiert in ' + (u.decode_s||0).toFixed(2) + ' s'
    : '';
}

/* ---------- one model turn ----------
   Returns {content, reasoning, calls}. The SSE frames carry tool_calls complete in a single
   delta, so there is nothing to reassemble here. */
async function streamOnce(v, step, sink){
  let firstTok = 0, usage = null;
  const t0 = performance.now();
  ctrl = new AbortController();

  const body = {
    model:'qwen', messages, stream:true,
    temperature: parseFloat($('#temp').value),
    max_tokens: parseInt($('#maxt').value, 10),
    enable_thinking: $('#think').checked
  };
  if (mode === 'agent' && tools.length) body.tools = tools;

  const r = await fetch('/v1/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json'},
    signal: ctrl.signal, body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0,300));

  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for(;;){
    const { done, value } = await rd.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    let nl;
    while ((nl = buf.indexOf('\n\n')) >= 0){
      const frame = buf.slice(0, nl); buf = buf.slice(nl + 2);
      if (!frame.startsWith('data:')) continue;
      const payload = frame.slice(5).trim();
      if (payload === '[DONE]') continue;
      let j; try { j = JSON.parse(payload); } catch { continue; }
      const d = j.choices?.[0]?.delta;
      if (d?.reasoning_content){
        if (!firstTok) firstTok = performance.now();
        sink.reasoning += d.reasoning_content;
        v.think.style.display = '';
        if (!v.think.open) v.think.open = true;
        v.inner.textContent = sink.reasoning; stick();
      }
      if (d?.content){
        if (!firstTok) firstTok = performance.now();
        if (!sink.content && sink.reasoning){ v.think.open = false;
          v.think.querySelector('summary').textContent = 'Gedankengang'; }
        sink.content += d.content;
        v.body.innerHTML = md(sink.content) + '<span class="cursor"></span>';
        stick();
      }
      if (d?.tool_calls) for (const t of d.tool_calls) sink.calls.push(t);
      if (j.usage) usage = j.usage;
    }
  }
  v.body.innerHTML = sink.content ? md(sink.content) : '';
  if (sink.reasoning) v.think.querySelector('summary').textContent = 'Gedankengang';
  else v.think.style.display = 'none';

  if (usage){
    tj.ptok += usage.prompt_tokens; tj.ctok += usage.completion_tokens;
    tj.cached += (usage.prompt_tokens_cached || 0);
    tj.model_s += (usage.prefill_s || 0) + (usage.decode_s || 0);
    tjPush({ kind:'model', step,
             ptok: usage.prompt_tokens, cached: usage.prompt_tokens_cached || 0,
             ctok: usage.completion_tokens,
             pre: usage.prefill_s || 0, dec: usage.decode_s || 0,
             ttft: ((firstTok || performance.now()) - t0)/1000 });
    statLine(usage);
  }
  return sink;
}

/* ---------- one tool call ----------
   Every path goes through /v1/tools/exec. A denial and a failure are both RESULTS: they are
   fed back to the model, because "old_string does not appear" is exactly the information it
   needs to fix its next attempt. Swallowing them in the UI would leave it guessing. */
async function runTool(call, host){
  const name = call.function.name;
  let args = {};
  try { args = JSON.parse(call.function.arguments || '{}'); } catch { args = {}; }
  const card = addCard(host, name, args);
  const t0 = performance.now();

  const post = approved => fetch('/v1/tools/exec', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, arguments: call.function.arguments || '{}', approved, project })
  }).then(r => r.json());

  let pre = ($('#appr').value === 'auto') || sessionAllow.has(name);
  let res;
  try { res = await post(pre); }
  catch(e){
    cardDone(card, 'err', '—', String(e.message), true);
    return 'tool ' + name + ' failed to run: ' + e.message;
  }

  if (res.decision === 'ask'){
    const verdict = await askApproval(card, name, args, res.reason);
    if (verdict === 'no'){
      cardDone(card, 'deny', 'abgelehnt', 'Vom Benutzer abgelehnt.', false);
      tjPush({ kind:'tool', name, ms: performance.now()-t0, bytes:0 });
      return 'The user declined to run this. Do not retry it; ask what to do instead.';
    }
    card.dataset.s = 'run';
    card.querySelector('.tc-meta').innerHTML = '<span class="spin">◌</span>';
    try { res = await post(true); }
    catch(e){ cardDone(card, 'err', '—', String(e.message), true); return 'tool failed: ' + e.message; }
  }

  const ms = performance.now() - t0;
  const text = res.content || res.reason || '';
  if (res.decision === 'deny'){
    cardDone(card, 'deny', 'verweigert', text, true);
    tjPush({ kind:'tool', name, ms, bytes:text.length });
    return 'REFUSED by the server: ' + text;
  }
  const bad = res.ok === false || (res.exit !== undefined && res.exit !== 0);
  cardDone(card, bad ? 'err' : 'ok',
           (res.ms !== undefined ? res.ms.toFixed(0) + ' ms' : ms.toFixed(0) + ' ms')
             + (res.exit ? ' · exit ' + res.exit : ''),
           text, bad);
  tj.tool_s += (res.ms || ms)/1000;
  tjPush({ kind:'tool', name, ms: res.ms !== undefined ? res.ms : ms,
           bytes: text.length, exit: res.exit });
  return text || '(no output)';
}

/* ---------- the agent loop ---------- */
async function ask(text){
  if (busy) return;
  busy = true; stopped = false; setSendIcon(true);
  addUser(text);
  messages.push({ role:'user', content:text });

  const maxSteps = mode === 'agent' ? Math.max(1, parseInt($('#steps').value,10) || 24) : 1;
  try {
    for (let step = 1; step <= maxSteps; step++){
      const v = addBot(step > 1);
      /* The sink belongs to the caller, so an abort keeps the half-written turn instead of
         dropping it. Keeping it matters twice over: the page shows what the user actually saw,
         and the engine's KV still HOLDS those tokens — sending them back is what lets the next
         turn extend the cached prefix rather than rebuild it. */
      const res = { content:'', reasoning:'', calls:[] };
      let died = false;
      try { await streamOnce(v, step, res); }
      catch(e){
        died = true;
        if (e.name === 'AbortError'){
          v.body.innerHTML = md(res.content)
            + '<p style="color:var(--fg-faint);font-size:13px">abgebrochen</p>';
        } else {
          v.body.innerHTML = '<p style="color:var(--bad)">' + esc(e.message) + '</p>';
        }
      }
      const am = { role:'assistant', content:res.content, reasoning_content:res.reasoning };
      if (res.calls.length && !died) am.tool_calls = res.calls;
      if (res.content || res.reasoning || am.tool_calls) messages.push(am);

      if (died || !res.calls.length || stopped) break;
      if (step === maxSteps){
        v.tools.insertAdjacentHTML('beforeend',
          '<div class="tc" data-s="err"><div class="tc-h"><span class="tc-ico">!</span>'
          + '<span class="tc-name">Schrittgrenze</span><span class="tc-arg">'
          + maxSteps + ' Schritte erreicht — nichts weiter ausgeführt</span></div></div>');
        break;
      }
      for (const c of res.calls){
        const out = await runTool(c, v.tools);
        messages.push({ role:'tool', tool_call_id: c.id, name: c.function.name, content: out });
        if (stopped) break;
      }
      if (stopped) break;
    }
  } finally {
    busy = false; ctrl = null; setSendIcon(false); send.disabled = false; ta.focus();
  }
}

function setSendIcon(stop){
  send.innerHTML = stop
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
}
function submit(){
  if (busy){ stopped = true; ctrl?.abort(); return; }
  const t = ta.value.trim();
  if (!t) return;
  ta.value = ''; ta.style.height = 'auto';
  ask(t);
}
send.onclick = submit;
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 190) + 'px';
});
chat.addEventListener('click', e => {
  if (e.target.classList.contains('chip')){ ta.value = e.target.textContent; submit(); }
});

/* ---------- mode ---------- */
function applyMode(){
  for (const b of document.querySelectorAll('#mode button')) b.classList.toggle('on', b.dataset.m === mode);
  const agent = mode === 'agent' && toolMode !== 'off';
  $('#steps').closest('label').style.display = agent ? '' : 'none';
  $('#appr').closest('label').style.display  = agent ? '' : 'none';
  ta.placeholder = agent ? 'Aufgabe beschreiben…  (Enter senden, Shift+Enter neue Zeile)'
                         : 'Nachricht schreiben…  (Enter senden, Shift+Enter neue Zeile)';
  /* The system prompt is the first thing in the prompt and therefore the most valuable cached
     bytes there are. Switching mode mid-conversation would change it and invalidate the whole
     prefix, so it is only ever set on an empty conversation. */
  if (!messages.length) newChat();
}
for (const b of document.querySelectorAll('#mode button'))
  b.onclick = () => { mode = b.dataset.m; localStorage.setItem('mode', mode); applyMode(); };

function newChat(){
  stopped = true; ctrl?.abort();
  messages = [];
  if (mode === 'agent' && toolMode !== 'off' && sysPrompt) messages.push({ role:'system', content: sysPrompt });
  tj = { steps: [], model_s:0, tool_s:0, ptok:0, ctok:0, cached:0 };
  tjRender(); emptyState();
  $('#stat').innerHTML = ''; $('#hint').textContent = '';
}
$('#reset').onclick = newChat;
$('#temp').oninput = e => $('#tv').textContent = (+e.target.value).toFixed(2);

/* ---------- what the server actually offers ---------- */
/* The registry is fetched PER PROJECT: the system prompt names the workspace, so it differs,
   and it is the first thing in the prompt. Switching project therefore changes the cached
   prefix — which is why it also starts a new conversation rather than pretending it can
   continue one. */
async function loadTools(){
  const t = await fetch('/v1/tools' + (project ? '?project=' + encodeURIComponent(project) : ''))
                  .then(r => r.json()).catch(() => null);
  if (t){
    tools = t.data || []; policy = t.policy || {};
    sysPrompt = t.system || ''; workspace = t.workspace || ''; toolMode = t.mode || 'off';
    $('#wsl').textContent = workspace + '  ·  ' + toolMode;
    if (toolMode === 'off') mode = 'chat';
  } else { toolMode = 'off'; mode = 'chat'; }
}

async function loadProjects(){
  const p = await fetch('/v1/projects').then(r=>r.json()).catch(()=>null);
  const sel = $('#proj');
  if (!p || !p.root){ sel.style.display = 'none'; $('#pnew').style.display = 'none'; return; }
  projectsRoot = p.root;
  const list = p.data || [];
  if (!list.some(x => x.name === project)) project = list.length ? list[0].name : '';
  sel.innerHTML = list.length
    ? list.map(x => '<option value="' + esc(x.name) + '"' + (x.name === project ? ' selected' : '')
        + '>' + esc(x.name) + ' · ' + x.entries + '</option>').join('')
    : '<option value="">(kein Projekt)</option>';
  localStorage.setItem('project', project);
}

$('#proj').onchange = async e => {
  project = e.target.value; localStorage.setItem('project', project);
  await loadTools(); applyMode(); newChat();
};
$('#pnew').onclick = async () => {
  const name = prompt('Name des neuen Projekts (Buchstaben, Ziffern, . _ -):');
  if (!name) return;
  const r = await fetch('/v1/projects', { method:'POST',
              headers:{'Content-Type':'application/json'}, body: JSON.stringify({name}) });
  if (!r.ok){ alert((await r.json()).error?.message || 'ging nicht'); return; }
  project = name; localStorage.setItem('project', project);
  await loadProjects(); await loadTools(); applyMode(); newChat();
};

(async () => {
  const h = await fetch('/health').then(r=>r.json()).catch(()=>null);
  if (h) $('#mname').textContent = h.model + ' · ' + (h.speculative ? 'GPU + spekulativ' : h.gpu ? 'GPU' : 'CPU');
  await loadProjects();
  await loadTools();
  applyMode(); newChat();
})();
ta.focus();
</script>
</body>
</html>
